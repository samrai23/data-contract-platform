[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "data-contract-platform"
version = "0.1.0"
description = "Agentic Data Contract & Ingestion Platform"
requires-python = ">=3.11"
dependencies = [
    # FastAPI
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",

    # GCP Pub/Sub
    "google-cloud-pubsub>=2.21.0",

    # GCP / BigQuery
    "google-cloud-bigquery>=3.20.0",
    "google-auth>=2.29.0",
    "db-dtypes>=1.2.0",

    # LangGraph + LangChain
    "langgraph>=0.1.0",
    "langchain>=0.2.0",
    "langchain-google-genai>=1.0.0",
    "langchain-core>=0.2.0",

    # MCP
    "mcp>=1.0.0",

    # NeMo Guardrails
    "nemoguardrails>=0.9.0",

    # Data quality
    "great-expectations>=0.18.0",

    # dbt
    "dbt-bigquery>=1.8.0",

    # Utilities
    "structlog>=24.1.0",
    "tenacity>=8.3.0",
    "arrow>=1.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "black>=24.0.0",
    "ruff>=0.4.0",
    "pre-commit>=3.7.0",
    "ipykernel>=6.29.0",
]

spark = [
    "pyspark>=3.5.0",
    "delta-spark>=3.1.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "UP"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Add project root and each service directory so tests can import without
# package install. "." makes "services.drift_detector.schema_comparator"
# work; "services/contract_api" makes "from main import app" work.
pythonpath = [
    ".",
    "services/contract_api",
    "services/drift_detector",
    "spark_jobs/streaming",
    "data_contracts/templates",
]
